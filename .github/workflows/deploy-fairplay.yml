name: Deploy FairPlay

# Deploys apps/music-exec-review to Cloudflare Workers whenever its files change
# on main. Requires the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:
# Edit, Workers KV Storage: Edit, Account Settings: Read).
on:
  push:
    branches: [main]
    paths:
      - "apps/music-exec-review/**"
      - ".github/workflows/deploy-fairplay.yml"
  # Lets you deploy the current branch by hand from the Actions tab.
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-fairplay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip on forks, where the deploy secret is not available.
    if: github.repository == 'jerseydemic/openclaw'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run store tests
        working-directory: apps/music-exec-review
        run: node --test

      - name: Deploy to Cloudflare Workers
        working-directory: apps/music-exec-review/deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
